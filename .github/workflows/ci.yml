name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  YTB_STATE_DIR: ${{ github.workspace }}/qa-state
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          swift test
          python3 tools/sync-strings.py --check
          python3 tools/test_build_cards.py
          python3 tools/test_make_appcast.py
      - name: Linux dependencies stay out of the macOS graph
        run: |
          set -euo pipefail
          dependencies=$(swift package show-dependencies)
          if grep -qi -e swift-crypto -e csqlite -e adwaita <<< "$dependencies"; then
            printf '%s\n' "$dependencies"
            exit 1
          fi
          git diff --exit-code Package.resolved
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build-linux
          key: linux-${{ hashFiles('Package.swift', 'docker/linux-dev.Dockerfile') }}
      - name: Build (Docker image from docker/linux-dev.Dockerfile)
        run: scripts/linux-build.sh build
      - name: Test
        run: scripts/linux-build.sh test
      - name: Native GTK UI tests
        run: YTB_SMOKE_NO_IMAGES=1 scripts/test-linux-ui.sh
      - name: Native image tests (offline)
        run: scripts/test-linux-images.sh
      - name: Screen smoke
        run: scripts/linux-smoke.sh all
      - name: Scenarios
        run: scripts/linux-scenarios.sh all
      - name: Exec restart
        run: scripts/test-linux-restart.sh
      # The Docker steps run as root on the bind-mounted workspace; the cache save and uploads run as the runner user.
      - name: Give the workspace back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .build-linux qa-state 2>/dev/null || true
      - name: Upload screens and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke
          path: |
            .build-linux/probes/**/*.png
            .build-linux/probes/**/*.log
            .build-linux/probes/**/*-state.json
          if-no-files-found: warn
