name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, SHA or tag to build (empty = the ref the workflow runs on)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish a GitHub Release (needs the exact v<CHANGELOG version> tag on the commit)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
      publish: ${{ steps.target.outputs.publish }}
      mac: ${{ steps.mac.outputs.mac }}
      lock_sha256: ${{ steps.lock.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Target commit and version
        id: target
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(awk '/^## [0-9]/{print $2; exit}' CHANGELOG.md)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid CHANGELOG version '$version'" >&2; exit 1; }
          if [[ "$EVENT" == push ]]; then
            publish=true
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "Tag $GITHUB_REF_NAME does not match CHANGELOG v$version" >&2; exit 1; }
          else
            publish=$PUBLISH_INPUT
          fi
          # Only a publishing run needs the exact release tag on the built commit; a build-only run takes any ref.
          if [[ "$publish" == true ]] && ! git tag --points-at HEAD | grep -qx "v$version"; then
            echo "Publishing needs tag v$version on $sha" >&2; exit 1
          fi
          printf 'sha=%s\nversion=%s\npublish=%s\n' "$sha" "$version" "$publish" | tee -a "$GITHUB_OUTPUT"
      - name: Mac signing secrets (all or none)
        id: mac
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in CERTIFICATE CERTIFICATE_PASSWORD SIGN_IDENTITY APPLE_ID APPLE_PASSWORD TEAM_ID SPARKLE_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} == 0 ]]; then mac=all
          elif [[ ${#missing[@]} == 7 ]]; then mac=none; echo '::notice::No Mac signing secrets: the release has Linux assets only.'
          else echo "Partial Mac signing configuration, missing: ${missing[*]}" >&2; exit 1
          fi
          echo "mac=$mac" | tee -a "$GITHUB_OUTPUT"
      - name: Resolve the Linux lock once (twice, must agree)
        id: lock
        run: |
          set -euo pipefail
          scripts/linux-build.sh package resolve
          first=$(sha256sum .build-linux/Package.resolved | cut -d' ' -f1)
          rm .build-linux/Package.resolved
          scripts/linux-build.sh package resolve
          second=$(sha256sum .build-linux/Package.resolved | cut -d' ' -f1)
          [[ "$first" == "$second" ]] || { echo "Linux lock is not stable: $first vs $second" >&2; exit 1; }
          echo "sha256=$first" | tee -a "$GITHUB_OUTPUT"
          echo "Linux lock sha256: \`$first\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-lock
          path: .build-linux/Package.resolved
          if-no-files-found: error

  build-macos:
    needs: prepare-release
    if: needs.prepare-release.outputs.mac == 'all'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          fetch-depth: 0
      - name: Test
        run: |
          swift test
          python3 tools/sync-strings.py --check
          python3 tools/test_make_appcast.py
      - name: Import distribution certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          xcrun notarytool store-credentials release --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID"
      - name: Build, notarize and package
        env:
          YTB_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          YTB_NOTARY_PROFILE: release
          YTB_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/release/YugiTokenBar-${{ env.VERSION }}.zip
            build/release/appcast.xml
            build/release/SHA256SUMS
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"

  build-linux:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            required: true
          # First beta: tried natively, never blocks the release, and a failure is recorded as such.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            required: false
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
      COMMIT: ${{ needs.prepare-release.outputs.sha }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
      LOCK_SHA256: ${{ needs.prepare-release.outputs.lock_sha256 }}
      YTB_STATE_DIR: ${{ github.workspace }}/qa-state
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-lock
          path: .build-linux
      - name: Verify the Linux lock
        run: |
          set -euo pipefail
          [[ "$(sha256sum .build-linux/Package.resolved | cut -d' ' -f1)" == "$LOCK_SHA256" ]]
      - name: Core, model and image tests with that lock (Docker dev image)
        run: |
          set -euo pipefail
          scripts/test-linux-images.sh
          [[ "$(sha256sum .build-linux/Package.resolved | cut -d' ' -f1)" == "$LOCK_SHA256" ]] || { echo 'Tests changed the Linux lock' >&2; exit 1; }
      - name: Build, install and run the Flatpak (GNOME 50 container)
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work ghcr.io/flathub-infra/flatpak-github-actions:gnome-50 \
            bash -c "scripts/build-flatpak.sh --arch $ARCH && scripts/test-flatpak.sh run build/release/YugiTokenBar-$VERSION-$ARCH.flatpak"
      # The containers run as root on the bind-mounted workspace; later steps run as the runner user.
      - name: Give the workspace back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" build .build-linux qa-state 2>/dev/null || true
      - name: Provenance
        run: |
          set -euo pipefail
          log=.build-linux/probes/flatpak/build-$ARCH.log
          {
            echo "commit: $COMMIT"
            echo "version: $VERSION"
            echo "arch: $ARCH"
            echo "linux lock sha256: $LOCK_SHA256"
            echo "bundle: $(grep " YugiTokenBar-$VERSION-$ARCH.flatpak" build/release/SHA256SUMS)"
            echo "test compiler (Docker dev image): $(docker run --rm ytb-linux-dev swift --version 2>/dev/null | head -1)"
            echo "bundle compiler (Flatpak SDK extension): $(grep -m1 '^Swift version' "$log")"
            grep -E '^(RUNTIME|Flatpak |flatpak-builder-|LINUX_LOCK|LOCK_SHA256)' "$log"
          } | tee "build/release/provenance-$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/release/YugiTokenBar-${{ env.VERSION }}-${{ matrix.arch }}.flatpak
            build/release/provenance-${{ matrix.arch }}.txt
          if-no-files-found: error
      - name: Record the result
        if: always()
        run: |
          echo "$ARCH: ${{ job.status == 'success' && 'passed' || 'failed' }}" | tee "status-$ARCH.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-status-${{ matrix.arch }}
          path: status-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-logs-${{ matrix.arch }}
          path: |
            .build-linux/probes/**/*.log
            .build-linux/probes/**/*.png
            .build-linux/probes/**/*-state.json
          if-no-files-found: warn

  publish:
    needs: [prepare-release, build-macos, build-linux]
    # build-macos is skipped when there are no Mac secrets; x86_64 is required (aarch64 is continue-on-error).
    if: >-
      !cancelled() && needs.prepare-release.outputs.publish == 'true'
      && needs.build-linux.result == 'success'
      && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{macos,linux-x86_64,linux-aarch64,linux-status-*}'
          merge-multiple: true
      - name: Publish release
        run: |
          set -euo pipefail
          tag="v$VERSION"
          cd dist
          cat status-*.txt
          [[ -f "YugiTokenBar-$VERSION-x86_64.flatpak" ]] || { echo 'Required x86_64 bundle missing' >&2; exit 1; }
          files=(YugiTokenBar-"$VERSION"-*.flatpak)
          extra=()
          if [[ -f "YugiTokenBar-$VERSION.zip" ]]; then
            # The Mac job checksummed its ZIP; the combined file must agree with it.
            grep " YugiTokenBar-$VERSION.zip\$" SHA256SUMS | sha256sum -c -
            files+=("YugiTokenBar-$VERSION.zip")
            extra=(appcast.xml)
          fi
          sha256sum "${files[@]}" | tee SHA256SUMS
          assets=("${files[@]}" "${extra[@]}" SHA256SUMS)
          cd ..
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          sections = re.split(r'^## ', text, flags=re.MULTILINE)
          Path('release-notes.md').write_text('## ' + sections[1])
          PY
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published artifacts.' >&2
            exit 1
          fi
          # Without the Mac ZIP there is no appcast, and a prerelease never becomes the latest that Mac updates read.
          if [[ ${#extra[@]} -gt 0 ]]; then flags=(--latest); else flags=(--prerelease --latest=false); fi
          (cd dist && gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$tag" --notes-file ../release-notes.md "${flags[@]}")
